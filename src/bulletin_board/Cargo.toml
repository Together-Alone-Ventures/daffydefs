[package]
name = "bulletin_board"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# ic-cdk 0.16→0.18 forced workspace-wide (executor `links` collision).
ic-cdk = "0.18"
# ic-cdk-timers removed: unused dependency forced into play by the executor
# collision (0.9 → ic-cdk 0.15 → executor 0.1.0). No `set_timer`/`TimerId` usage.
candid = "0.10"
serde = { version = "1", features = ["derive"] }
ic-stable-structures = "0.6"  # retained — live BTreeMap/Cell encodings unchanged
shared = { path = "../shared" }
