[package]
name = "profile_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ic-cdk = "0.17"
ic-cdk-timers = "0.9"
candid = "0.10"
serde = { version = "1", features = ["derive"] }
ic-stable-structures = "0.6"
shared = { path = "../shared" }

# MKTd02: Cryptographically Verifiable Deletion Receipts
mktd02 = { git = "https://github.com/Together-Alone-Ventures/ICP-Delete-Leaf.git", tag = "mktd02-v0.4.0", package = "mktd02" }

# zombie-core: pin to the same source form as mktd02 to avoid duplicate crates
zombie-core = { git = "https://github.com/Together-Alone-Ventures/zombie-core", tag = "zombie-core-v0.3.1" }

hex = "0.4"
