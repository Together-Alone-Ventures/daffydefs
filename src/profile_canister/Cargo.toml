[package]
name = "profile_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ic-cdk = "0.17"
ic-cdk-timers = "0.9"
candid = "0.10"
serde = { version = "1", features = ["derive"] }
ic-stable-structures = "0.6"
shared = { path = "../shared" }

# MKTd02: Cryptographically Verifiable Deletion Receipts
mktd02 = { git = "https://github.com/Together-Alone-Ventures/MKTd02.git", branch = "v0.2.0", package = "mktd02" }

# zombie-core: pin to the same source form as mktd02 to avoid duplicate crates
zombie-core = { git = "https://github.com/Together-Alone-Ventures/zombie-core", rev = "11dcd420196e58be6238e5693505e9560062a3b6" }

hex = "0.4"
