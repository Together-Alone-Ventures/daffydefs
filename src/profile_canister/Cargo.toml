[package]
name = "profile_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# ic-cdk 0.17→0.18 forced workspace-wide (executor `links` collision).
ic-cdk = "0.18"
# ic-cdk-timers removed: unused dependency forced into play by the executor collision.
candid = "0.10"
serde = { version = "1", features = ["derive"] }
# is-0.6→0.7 forced HERE ONLY — to interoperate with mktd02 v0.4.1 (is-0.7).
# StoredProfile encoding stays byte-identical (Candid; Bound unchanged; is-0.7
# Cell format == is-0.6 SCL format → existing data reads on upgrade).
ic-stable-structures = "0.7"
shared = { path = "../shared" }

# Exact inspected v5.1 Leaf/core inputs; source replacement is in .cargo/config.toml.
mktd02 = { git = "https://github.com/Together-Alone-Ventures/ICP-Delete-Leaf.git", rev = "8e5024dc8d27be19dafc579b2ac955e45da28b0c", package = "mktd02" }
zombie-core = { git = "https://github.com/Together-Alone-Ventures/zombie-core", rev = "8ac64df5d0110ec7ebbbe8382b7a826dda17085a" }

hex = "0.4"
