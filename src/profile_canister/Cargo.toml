[package]
name = "profile_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# ic-cdk 0.17→0.18 forced workspace-wide (executor `links` collision).
ic-cdk = "0.18"
# ic-cdk-timers removed: unused dependency forced into play by the executor collision.
candid = "0.10"
serde = { version = "1", features = ["derive"] }
# is-0.6→0.7 forced HERE ONLY — to interoperate with mktd02 v0.4.1 (is-0.7).
# StoredProfile encoding stays byte-identical (Candid; Bound unchanged; is-0.7
# Cell format == is-0.6 SCL format → existing data reads on upgrade).
ic-stable-structures = "0.7"
shared = { path = "../shared" }

# MKTd02: Cryptographically Verifiable Deletion Receipts (Gate 2 v4 adoption:
# mktd02-v0.5.0 — subnet-attested code identity; 3-arg finalize adds the
# module_hash_certificate). Released tag, never a path dep.
mktd02 = { git = "https://github.com/Together-Alone-Ventures/ICP-Delete-Leaf.git", tag = "mktd02-v0.5.0", package = "mktd02" }

# zombie-core: pin to EXACTLY what mktd02-v0.5.0 pins (mktd02/Cargo.toml @ tag
# mktd02-v0.5.0 -> zombie-core-v0.4.0) to keep a single zombie-core in the graph.
zombie-core = { git = "https://github.com/Together-Alone-Ventures/zombie-core", tag = "zombie-core-v0.4.0" }

hex = "0.4"
