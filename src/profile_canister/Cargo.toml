[package]
name = "profile_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# ic-cdk 0.17→0.18 forced workspace-wide (executor `links` collision).
ic-cdk = "0.18"
# ic-cdk-timers removed: unused dependency forced into play by the executor collision.
candid = "0.10"
serde = { version = "1", features = ["derive"] }
# is-0.6→0.7 forced HERE ONLY — to interoperate with mktd02 v0.4.1 (is-0.7).
# StoredProfile encoding stays byte-identical (Candid; Bound unchanged; is-0.7
# Cell format == is-0.6 SCL format → existing data reads on upgrade).
ic-stable-structures = "0.7"
shared = { path = "../shared" }

# Exact inspected v5 Leaf/core inputs; source replacement is in .cargo/config.toml.
mktd02 = { git = "https://github.com/Together-Alone-Ventures/ICP-Delete-Leaf.git", rev = "2a10bf3ee056d3ff53327ca23654609a6f430c5e", package = "mktd02" }
zombie-core = { git = "https://github.com/Together-Alone-Ventures/zombie-core", rev = "223723885cfbb548d6b218aee8500b073fda4b58" }

hex = "0.4"
