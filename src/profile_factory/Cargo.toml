[package]
name = "profile_factory"
version = "0.1.0"
edition = "2021"

# "lib" (rlib) added alongside "cdylib" so the [R] unit tests link natively;
# the shipped canister artifact is still the cdylib wasm.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# ic-cdk 0.16→0.18 forced workspace-wide (executor `links` collision).
ic-cdk = "0.18"
# ic-cdk-timers removed: unused dependency forced into play by the executor collision.
candid = "0.10"
serde = { version = "1", features = ["derive"] }
ic-stable-structures = "0.6"  # retained — live PROFILE_MAP encoding unchanged
shared = { path = "../shared" }
sha2 = "0.10"
hex = "0.4"
