[package]
name = "mktd02-verify"
# 0.8.0 DRAFT: mktd02-v5 retrofit (zombie-core 2237238; V1/V2/V3A/V3B, explicit
# trust root, per-line validity). Untagged until released. Tracks the CVDR-Verify
# release tag once tagged; v0.7.0 was the last tagged release.
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
description = "Reference verifier for MKTd02 deletion receipts (mktd02-v5 and historical lines) and OpenChatZD packages"

[dependencies]
# Pinned by git URL + rev, never by path or branch.
# NAMING CONVENTION: always write "zombie-core vX.Y.Z" when referencing
# this alongside MKTd02 version strings — never just "v0.x.y".
# zombie-core v0.5.0 (branch v5) @ 2237238: mktd02-v5 Direct Certification
# (DeletionReceiptV5, AnyDeletionReceipt, verify_v1, retired TAG_CERTIFIED) and
# the countersigned v5 corpus (corpus commit 40ba6db). v2–v4 receipts decode as
# the frozen DeletionReceiptV4.
zombie-core = { git = "https://github.com/Together-Alone-Ventures/zombie-core", rev = "223723885cfbb548d6b218aee8500b073fda4b58" }
ic-agent = "=0.39.3"
candid = "=0.10.23"
clap = { version = "=4.5.60", features = ["derive"] }
hex = "=0.4.3"
tokio = { version = "=1.49.0", features = ["full"] }
anyhow = "=1.0.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_cbor = "=0.11.2"
ciborium = "=0.2.2"
serde_json = "=1.0.149"
ic-verify-bls-signature = "=0.5.0"
# Portable frozen-package artifact: byte fields accept hex or base64 (already
# present in the lock as a transitive dep; pinned here for the OpenChatZD path).
base64 = "=0.22.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }

# Standalone DaffyDefs convenience-tool build boundary.
[workspace]
